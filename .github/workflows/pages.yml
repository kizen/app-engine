name: Deploy docs site

# Builds docs/site/dist from the markdown under docs/ and publishes it to GitHub Pages.
#
# Scoped to docs/**: the only inputs to the build are the markdown corpus and the generator, both of
# which live there, so a change to the engine source can't affect the published site. The workflow
# file itself is included so a change to the build steps redeploys.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deployment — a half-applied Pages deploy is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The docs site is a standalone npm project with its own lockfile, deliberately outside the
      # engine's pnpm workspace — it shares no dependencies with the package being published.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install
        working-directory: docs/site
        run: npm ci

      - name: Test
        working-directory: docs/site
        run: npm test

      # --strict fails the build on any unresolved internal link or anchor. The corpus has ~1,800 of
      # them, hand-authored against GitHub's rendering, so this is the check that keeps a published
      # doc from shipping links that silently go nowhere.
      - name: Build
        working-directory: docs/site
        run: node build.mjs --strict

      - uses: actions/configure-pages@v5

      # Every asset and nav href in the output is page-relative, so the site works unchanged under a
      # project-site subpath with no base-URL configuration.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
