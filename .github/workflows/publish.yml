name: Publish Prerelease to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Build & Publish (Prerelease)
    permissions:
      contents: read
      id-token: write # Required for OIDC
    uses: ./.github/workflows/npm-publish.yml
    with:
      npm_tag: next
      short_sha: ${{ github.sha }}
    secrets: inherit
