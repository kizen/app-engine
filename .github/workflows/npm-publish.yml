name: npm Publish

on:
  workflow_call:
    inputs:
      npm_tag:
        type: string
        required: true
      short_sha:
        type: string
        required: false
      release_version:
        type: string
        required: false

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp prerelease version
        if: ${{ inputs.short_sha != '' }}
        run: pnpm run version:prerelease
        env:
          SHORT_SHA: ${{ inputs.short_sha }}

      - name: Check version matches tag
        if: ${{ inputs.release_version != '' }}
        run: pnpm run version:check
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}

      - name: Publish to npm
        run: pnpm publish --no-git-checks --tag ${{ inputs.npm_tag }} --access public
